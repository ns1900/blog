<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>南瓜镇 · 内容管理</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4ede9;
        font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #241a16;
      }
      #fallback {
        max-width: 34rem;
        margin: 12vh auto;
        padding: 2rem;
        border: 1px solid #d8c9c0;
        line-height: 1.9;
        font-size: 0.92rem;
      }
      #fallback h1 {
        font-family: 'Songti SC', 'SimSun', serif;
        font-size: 1.3rem;
        letter-spacing: 0.1em;
        margin: 0 0 0.8rem;
      }
      #fallback code {
        background: #efe6e0;
        padding: 0.1em 0.35em;
        font-size: 0.85em;
        word-break: break-all;
      }
      #fallback a {
        color: #a8471f;
      }
      #fallback p {
        margin: 0.6rem 0;
      }
      #fallback .muted {
        color: #8b7870;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <div id="fallback">
      <h1>内容管理后台</h1>
      <p>正在加载编辑器…</p>
      <p class="muted">如果超过 20 秒还停在这里，说明加载失败。常见原因：</p>
      <p class="muted">
        1. 当前网络访问不了 unpkg.com（国内偶发）→ 换网络或用手机热点试试<br />
        2. OAuth 环境变量缺失 → Vercel 项目设置里检查 OAUTH_CLIENT_ID 等<br />
        3. 本地写作入口：双击项目里的 <code>start.bat</code>，访问
        <code>http://localhost:4321/admin</code>
      </p>
    </div>

    <!-- Decap CMS 主程序：自动加载 /config.yml（由 vercel.json rewrite 指到 /admin-cms/config.yml） -->
    <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  </body>
</html>
