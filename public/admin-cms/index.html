<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>南瓜镇 · 内容管理</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4ede9;
        font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #241a16;
      }
      #fallback {
        max-width: 34rem;
        margin: 12vh auto;
        padding: 2rem;
        border: 1px solid #d8c9c0;
        line-height: 1.9;
        font-size: 0.92rem;
      }
      #fallback h1 {
        font-family: 'Songti SC', 'SimSun', serif;
        font-size: 1.3rem;
        letter-spacing: 0.1em;
        margin: 0 0 0.8rem;
      }
      #fallback code {
        background: #efe6e0;
        padding: 0.1em 0.35em;
        font-size: 0.85em;
        word-break: break-all;
      }
      #fallback a {
        color: #a8471f;
      }
      #fallback p {
        margin: 0.6rem 0;
      }
      #fallback .muted {
        color: #8b7870;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <div id="fallback">
      <h1>内容管理后台</h1>
      <p>正在加载编辑器…</p>
      <p class="muted">如果超过 20 秒还停在这里，说明加载失败。常见原因：</p>
      <p class="muted">
        1. 当前网络访问不了 unpkg.com（国内偶发）→ 换网络或用手机热点试试<br />
        2. OAuth 环境变量缺失 → Vercel 项目设置里检查 OAUTH_CLIENT_ID 等<br />
        3. 本地写作入口：双击项目里的 <code>start.bat</code>，访问
        <code>http://localhost:4321/admin</code>
      </p>
    </div>

    <!-- 备用登录：整页跳转方式，不依赖弹窗与 postMessage -->
    <div id="alt-login">
      <a href="/admin-cms/login.html?direct=1">登录遇到问题？点这里用备用方式登录</a>
    </div>
    <style>
      #alt-login {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 1.2rem;
        text-align: center;
        font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 0.78rem;
        z-index: 999;
      }
      #alt-login a {
        color: #8b7870;
        text-decoration: none;
        border-bottom: 1px dashed #c9b8ae;
        padding-bottom: 1px;
      }
      #alt-login a:hover {
        color: #a8471f;
        border-bottom-color: #a8471f;
      }
    </style>

    <!-- Decap CMS 主程序：自动加载 /config.yml（由 vercel.json rewrite 指到 /admin-cms/config.yml） -->
    <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
    <script>
      // Decap 挂载后隐藏占位说明，避免登录界面被挤到下方
      (function check() {
        var root = document.getElementById('nc-root');
        if (root && root.children.length > 0) {
          var fb = document.getElementById('fallback');
          if (fb) fb.style.display = 'none';
        } else {
          setTimeout(check, 500);
        }
      })();
    </script>
  </body>
</html>
